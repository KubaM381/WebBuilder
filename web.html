<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>WebBuilder Pro</title>
  <link rel="stylesheet" href="sytlesweb.css">
</head>
<body>
  <!-- Header Toolbar -->
  <header class="app-header">
    <div class="brand">WebBuilder <span>Pro</span></div>
    <div class="toolbar-actions">
      <button class="btn btn-secondary" id="btn-cart-mode">🛒 Warenkorb bearbeiten</button>
      <button class="btn btn-secondary" id="btn-mode-toggle">👀 Vorschau</button>
      <button class="btn btn-danger-outline" id="btn-clear" style="width:auto;">🗑️ Leeren</button>
      <button class="btn" id="btn-undo" disabled>↩️</button>
      <button class="btn" id="btn-redo" disabled>↪️</button>
      <button class="btn btn-secondary" id="btn-export">💾 Export</button>
      <button class="btn btn-primary" id="btn-save">🚀 Speichern</button>
    </div>
  </header>

  <!-- Layout Body -->
  <div class="app-body">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-tab="elements">Ebene</button>
        <button class="sidebar-tab" data-tab="header">Kopfzeile</button>
        <button class="sidebar-tab" data-tab="footer">Fußzeile</button>
        <button class="sidebar-tab" data-tab="cart">Warenkorb</button>
        <button class="sidebar-tab" data-tab="products">📦 Produkte</button>
      </div>

      <div class="sidebar-panel" id="panel-elements">
        <div class="sidebar-subsection sidebar-bg-controls">
          <label>Seiten-Hintergrund</label>
          <div class="mini-btn-row">
            <button class="btn btn-sm btn-secondary" id="bg-type-solid">Farbe</button>
            <button class="btn btn-sm btn-secondary" id="bg-type-img">Bild/URL</button>
          </div>
          <input type="color" id="bg-color-input" value="#ffffff" style="margin-top:6px;">
          <input type="text" id="bg-image-url" placeholder="Bild-URL..." class="hidden" style="margin-top:6px;">
        </div>
        <div class="divider"></div>
        <div id="icon-palette-custom"></div>
      </div>

      <div class="sidebar-panel hidden" id="panel-header">
        <div class="sidebar-subsection">
          <label class="checkbox-row"><input type="checkbox" id="header-toggle"> Kopfzeile aktivieren</label>
          <label class="checkbox-row"><input type="checkbox" id="header-sticky-toggle"> Oben anheften (Sticky)</label>
          <div class="form-group">
            <label>Höhe (px)</label>
            <input type="number" id="header-height-input" value="64">
          </div>
        </div>
      </div>

      <div class="sidebar-panel hidden" id="panel-footer">
        <div class="sidebar-subsection">
          <label class="checkbox-row"><input type="checkbox" id="footer-toggle"> Fußzeile aktivieren</label>
          <div class="form-group">
            <label>Höhe (px)</label>
            <input type="number" id="footer-height-input" value="70">
          </div>
        </div>
      </div>

      <div class="sidebar-panel hidden" id="panel-cart">
        <div class="sidebar-subsection">
          <button class="btn btn-primary" id="btn-open-cart" style="width:100%; margin-bottom:10px;">🛒 Warenkorb öffnen</button>
          <div class="form-group">
            <label>Kassen-Button Text</label>
            <input type="text" id="cart-button-label" value="Zur Kasse gehen">
          </div>
          <div class="form-group">
            <label>Kassen-Button Farbe</label>
            <input type="color" id="cart-button-color" value="#4f46e5">
          </div>
        </div>
        <div class="sidebar-subsection">
          <label class="checkbox-row"><input type="checkbox" id="cart-discount-toggle"> Rabattcode aktivieren</label>
        </div>
        <div class="sidebar-subsection">
          <label class="checkbox-row"><input type="checkbox" id="cart-recommend-toggle"> Empfehlungen (Upsell)</label>
          <div id="cart-recommend-config" class="hidden">
            <div id="cart-recommend-list" class="items-list"></div>
            <button class="btn btn-sm btn-secondary" id="btn-add-recommendation">+ Empfehlung hinzufügen</button>
          </div>
        </div>
        <div class="sidebar-subsection">
          <label class="checkbox-row"><input type="checkbox" id="cart-progress-toggle"> Meilensteine / Progressbar</label>
          <div id="cart-progress-config" class="hidden">
            <div id="cart-milestone-list" class="items-list"></div>
            <button class="btn btn-sm btn-secondary" id="btn-add-milestone">+ Meilenstein hinzufügen</button>
          </div>
        </div>
      </div>

      <div class="sidebar-panel hidden" id="panel-products">
        <div class="sidebar-subsection">
          <button class="btn btn-primary" id="btn-add-product" style="width:100%; margin-bottom:10px;">+ Neues Produkt</button>
          <div id="product-list"></div>
        </div>
      </div>
    </aside>

    <!-- Canvas Area -->
    <main class="canvas-container" id="canvas-container">
      <div class="zoom-controls">
        <button id="zoom-out">−</button>
        <span id="zoom-level">85%</span>
        <button id="zoom-in">+</button>
        <button id="zoom-reset">Reset</button>
      </div>
      
      <!-- Center Snap Guides -->
      <div id="snap-guide-v" class="snap-guide hidden"></div>
      <div id="snap-guide-h" class="snap-guide hidden"></div>

      <div class="canvas-column" id="canvas-column">
        <div class="canvas-area" id="canvas">
          <div class="canvas-hint" id="canvas-hint">Bitte Einstellungen anpassen...</div>
        </div>
        <div class="canvas-extend-wrap">
          <button class="btn btn-secondary btn-sm" id="btn-extend-canvas">⬇️ Seite verlängern</button>
        </div>
      </div>
    </main>

    <!-- Right Sidebar (Unified Inspector) -->
    <aside class="inspector">
      <div id="inspector-empty" class="empty-inspector">Bitte wähle ein Element, die Kopf-/Fußzeile oder bearbeite den Warenkorb.</div>
      
      <!-- Editor for Canvas / Bar Items -->
      <div id="inspector-form" class="hidden">
        <h3>Element bearbeiten</h3>
        <input type="hidden" id="prop-id">
        <div class="form-group">
          <label>Typ</label>
          <input type="text" id="prop-type-display" disabled>
        </div>
        <div class="form-group" id="group-text">
          <label>Text / Inhalt</label>
          <input type="text" id="prop-text">
          <div class="text-toolbar" id="prop-text-toolbar" style="margin-top:6px;">
            <button type="button" class="ttb-btn" id="ttb-bold"><b>F</b></button>
            <button type="button" class="ttb-btn" id="ttb-italic"><i>K</i></button>
            <button type="button" class="ttb-btn" id="ttb-underline"><u>U</u></button>
            <span class="ttb-sep"></span>
            <button type="button" class="ttb-btn" id="ttb-align-left">⬅</button>
            <button type="button" class="ttb-btn" id="ttb-align-center">↔</button>
            <button type="button" class="ttb-btn" id="ttb-align-right">➡</button>
            <span class="ttb-sep"></span>
            <input type="color" id="prop-color" value="#111827">
            <select id="prop-font-family">
              <option value="inherit">Standard</option>
              <option value="'Georgia', serif">Serif</option>
              <option value="'Courier New', monospace">Monospace</option>
              <option value="'Segoe UI', sans-serif">Sans-Serif</option>
            </select>
          </div>
        </div>
        <div class="form-group" id="group-image" class="hidden">
          <label>Bild URL oder Datei</label>
          <input type="text" id="prop-image-url" placeholder="https://...">
          <label class="checkbox-row" style="margin-top:8px;"><input type="checkbox" id="prop-hover-effect"> Hover-Rahmen-Effekt</label>
        </div>
        <div class="form-group" id="group-action">
          <label>Klick-Aktion</label>
          <select id="prop-action-type">
            <option value="none">Keine</option>
            <option value="cart-open">Warenkorb öffnen</option>
            <option value="cart-add">In den Warenkorb</option>
            <option value="open-url">Link öffnen</option>
            <option value="alert-msg">Nachricht anzeigen</option>
          </select>
        </div>
        <div class="form-group hidden" id="group-action-url">
          <label>Ziel-URL</label>
          <input type="text" id="prop-action-url" placeholder="https://...">
        </div>
        <div class="form-group hidden" id="group-action-msg">
          <label>Hinweistext</label>
          <input type="text" id="prop-action-msg" placeholder="Meldung...">
        </div>
        <div class="form-group hidden" id="group-product">
          <label>Produkt auswählen</label>
          <select id="prop-product"></select>
        </div>
        <div class="divider"></div>
        <button class="btn btn-danger-outline" id="btn-delete-element">Element löschen</button>
      </div>

      <!-- Editor for Bar Backgrounds (Header/Footer) -->
      <div id="inspector-bar-bg" class="hidden">
        <h3 id="bar-bg-title">Kopfzeile Hintergrund</h3>
        <div class="form-group">
          <label>Hintergrundfarbe</label>
          <input type="color" id="bar-bg-color">
        </div>
        <div class="form-group">
          <label>Hintergrundbild URL</label>
          <input type="text" id="bar-bg-image" placeholder="URL für Hintergrund...">
        </div>
        <div class="divider"></div>
        <button class="btn btn-secondary" id="btn-add-bar-text">+ Text-Element einfügen</button>
        <button class="btn btn-secondary" id="btn-add-bar-img" style="margin-top:6px;">+ Bild/Icon einfügen</button>
      </div>

      <!-- Editor for Cart Parts -->
      <div id="inspector-cart-part" class="hidden">
        <h3 id="cart-part-title">Warenkorb Komponente</h3>
        <div class="form-group" id="cart-part-shape-group">
          <label>Form</label>
          <select id="cart-part-shape">
            <option value="rounded">Abgerundet</option>
            <option value="square">Eckig</option>
            <option value="circle">Rund (Pill)</option>
            <option value="transparent">Durchsichtig</option>
          </select>
        </div>
        <div class="form-group hidden" id="cart-part-color-group">
          <label>Farbschema (+/- Buttons)</label>
          <select id="cart-part-color-scheme">
            <option value="greenred">Grün/Rot</option>
            <option value="black">Schwarz</option>
            <option value="gray">Grau</option>
          </select>
        </div>
        <div class="form-group hidden" id="cart-part-grouping">
          <label>Anzeige als</label>
          <select id="cart-part-group-type">
            <option value="individual">Einzelne Blöcke</option>
            <option value="group">Als zusammenhängende Gruppe</option>
            <option value="none">Ohne Hintergrund</option>
          </select>
        </div>
        <div class="form-group" id="cart-part-icon-group" class="hidden">
          <label>Eigenes Icon/Bild (URL)</label>
          <input type="text" id="cart-part-icon-url" placeholder="Standard Icon nutzen...">
        </div>
      </div>
    </aside>
  </div>

  <!-- Cart Drawer -->
  <div class="drawer-backdrop" id="cart-drawer-backdrop"></div>
  <div class="drawer" id="cart-drawer">
    <div class="drawer-header">
      <h3>Warenkorb (<span id="cart-count-badge">0</span>)</h3>
      <button class="close-btn" id="close-cart-btn">✕</button>
    </div>
    <div class="drawer-body">
      <div id="cart-items-list"></div>
    </div>
    <div class="drawer-footer">
      <button class="btn btn-primary" id="cart-checkout-btn" style="width:100%; font-size:1.05rem; padding:12px;">Zur Kasse gehen</button>
    </div>
  </div>

  <!-- Modals & Toasts -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-title">Titel</h3>
        <button class="close-btn" id="close-modal-btn">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>
  <div id="toast-container"></div>

  <script src="builderweb.js"></script>
</body>
</html>
