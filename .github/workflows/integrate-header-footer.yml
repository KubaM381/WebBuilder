name: Integrate header footer state

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[step2-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Switch legacy header/footer state to shared service
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('js/builder-legacy.js')
          text = path.read_text(encoding='utf-8')

          marker = '  // ============================================================\n  // DOM ELEMENTS\n'
          start = text.find('  let headerEnabled = false;')
          end = text.find(marker)
          if start < 0 or end < 0 or start >= end:
              raise SystemExit('Step 2 integration marker not found; refusing to modify builder-legacy.js')

          proxy = '''  const headerState = {\n    get enabled() { return window.WebBuilderHeaderFooter.getHeader().enabled; },\n    set enabled(value) { window.WebBuilderHeaderFooter.updateHeader({ enabled: value }, false); },\n    get sticky() { return window.WebBuilderHeaderFooter.getHeader().sticky; },\n    set sticky(value) { window.WebBuilderHeaderFooter.updateHeader({ sticky: value }, false); },\n    get height() { return window.WebBuilderHeaderFooter.getHeader().height; },\n    set height(value) { window.WebBuilderHeaderFooter.updateHeader({ height: value }, false); },\n    get bgColor() { return window.WebBuilderHeaderFooter.getHeader().bgColor; },\n    set bgColor(value) { window.WebBuilderHeaderFooter.updateHeader({ bgColor: value }, false); },\n    get items() { return window.WebBuilderHeaderFooter.getHeader().items; },\n    set items(value) { window.WebBuilderHeaderFooter.updateHeader({ items: value }, false); }\n  };\n\n  const footerState = {\n    get enabled() { return window.WebBuilderHeaderFooter.getFooter().enabled; },\n    set enabled(value) { window.WebBuilderHeaderFooter.updateFooter({ enabled: value }, false); },\n    get height() { return window.WebBuilderHeaderFooter.getFooter().height; },\n    set height(value) { window.WebBuilderHeaderFooter.updateFooter({ height: value }, false); },\n    get bgColor() { return window.WebBuilderHeaderFooter.getFooter().bgColor; },\n    set bgColor(value) { window.WebBuilderHeaderFooter.updateFooter({ bgColor: value }, false); },\n    get items() { return window.WebBuilderHeaderFooter.getFooter().items; },\n    set items(value) { window.WebBuilderHeaderFooter.updateFooter({ items: value }, false); }\n  };\n\n  let selectedBarItemRef = null; // { items, id, listType: 'header'|'footer' }\n\n  const STORAGE_KEY = "webbuilder_pro_state";\n  const HISTORY_LIMIT = 30;\n  let historyStack = [];\n  let redoStack = [];\n  let pendingSnapshot = null;\n\n'''
          text = text[:start] + proxy + text[end:]

          replacements = {
              'headerEnabled': 'headerState.enabled',
              'headerSticky': 'headerState.sticky',
              'headerHeight': 'headerState.height',
              'headerBgColor': 'headerState.bgColor',
              'headerItems': 'headerState.items',
              'footerEnabled': 'footerState.enabled',
              'footerHeight': 'footerState.height',
              'footerBgColor': 'footerState.bgColor',
              'footerItems': 'footerState.items',
          }
          for old, new in replacements.items():
              text = re.sub(rf'\\b{re.escape(old)}\\b', new, text)

          # The replacement above intentionally also updates the legacy declaration area
          # if it occurs elsewhere. Verify no standalone legacy state identifiers remain.
          for old in replacements:
              if re.search(rf'\\b{re.escape(old)}\\b', text):
                  raise SystemExit(f'Legacy identifier still present: {old}')

          path.write_text(text, encoding='utf-8')
      - name: Commit integrated legacy editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/builder-legacy.js
          git diff --cached --quiet && exit 0
          git commit -m "Complete step 2: use shared header/footer state [step2-integrated]"
          git push
