name: Repair step 2 integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[step2-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair generated references and snapshot keys
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/builder-legacy.js')
          text = p.read_text(encoding='utf-8')
          fixes = {
              'headerState.stickyToggle': 'headerStickyToggle',
              'headerState.heightInput': 'headerHeightInput',
              'headerState.itemsListEl': 'headerItemsListEl',
              'footerState.heightInput': 'footerHeightInput',
              'footerState.itemsListEl': 'footerItemsListEl',
              'prev.headerState.enabled': 'prev.headerEnabled',
              'prev.headerState.sticky': 'prev.headerSticky',
              'prev.headerState.height': 'prev.headerHeight',
              'prev.headerState.bgColor': 'prev.headerBgColor',
              'prev.headerState.items': 'prev.headerItems',
              'prev.footerState.enabled': 'prev.footerEnabled',
              'prev.footerState.height': 'prev.footerHeight',
              'prev.footerState.bgColor': 'prev.footerBgColor',
              'prev.footerState.items': 'prev.footerItems',
              'headerState.enabled, headerState.sticky, headerState.height, headerState.bgColor, headerState.items,': 'headerEnabled: headerState.enabled, headerSticky: headerState.sticky, headerHeight: headerState.height, headerBgColor: headerState.bgColor, headerItems: headerState.items,',
              'footerState.enabled, footerState.height, footerState.bgColor, footerState.items,': 'footerEnabled: footerState.enabled, footerHeight: footerState.height, footerBgColor: footerState.bgColor, footerItems: footerState.items,',
          }
          for old, new in fixes.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
      - name: Syntax check
        run: node --check js/builder-legacy.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/builder-legacy.js
          git commit -m "Repair step 2 header/footer integration [step2-repaired]"
          git push
