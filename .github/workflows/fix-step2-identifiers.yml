name: Finish header footer identifier migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[step2-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace remaining legacy identifiers
        shell: python
        run: |
          from pathlib import Path
          path = Path('js/builder-legacy.js')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'headerEnabled': 'headerState.enabled',
              'headerSticky': 'headerState.sticky',
              'headerHeight': 'headerState.height',
              'headerBgColor': 'headerState.bgColor',
              'headerItems': 'headerState.items',
              'footerEnabled': 'footerState.enabled',
              'footerHeight': 'footerState.height',
              'footerBgColor': 'footerState.bgColor',
              'footerItems': 'footerState.items',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
      - name: Validate and commit
        run: |
          if grep -nE '\b(headerEnabled|headerSticky|headerHeight|headerBgColor|headerItems|footerEnabled|footerHeight|footerBgColor|footerItems)\b' js/builder-legacy.js; then
            echo 'Legacy header/footer identifiers remain.'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/builder-legacy.js
          git commit -m "Finish step 2 header/footer integration [step2-fixed]"
          git push
