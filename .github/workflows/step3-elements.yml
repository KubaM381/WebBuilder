name: WebBuilder Step 3 migration

on:
  push:
    paths:
      - '.migration-step3'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply guarded Step 3 migration
        run: python scripts/migrate_step3.py

      - name: Verify syntax
        run: node --check js/builder-legacy.js

      - name: Commit migration and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/builder-legacy.js
          git rm -f scripts/migrate_step3.py .migration-step3 .github/workflows/step3-elements.yml
          git commit -m 'Complete Step 3: migrate elements and inspector state'
          git push
