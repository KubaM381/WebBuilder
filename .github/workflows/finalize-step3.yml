name: Finalize WebBuilder Step 3
on:
  push:
    paths: ['.finalize-step3']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/finalize_step3.py
      - run: node --check js/builder-legacy.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/builder-legacy.js
          git rm -f scripts/finalize_step3.py .finalize-step3 .github/workflows/finalize-step3.yml
          git commit -m 'Finish Step 3: integrate elements and inspector selection'
          git push
